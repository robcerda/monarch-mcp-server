[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monarch-mcp-server"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Monarch Money personal finance platform"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rob Cerda" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    # Floor is 1.30.0 because of #153, a remotely triggerable denial of
    # service in the HTTP transport. Up to and including 1.29.1 the session
    # manager registers a transport before the Host check runs, so every
    # rejected request leaks a session that is never freed, and a protocol
    # correct DELETE leaves its entry behind too. Measured on the versions
    # themselves: 150 requests with a forged Host leak 150 sessions on
    # 1.22.0 through 1.29.1, and none on 1.30.0. Reachable from any page the
    # user visits, so the floor carries it rather than a note in the docs.
    #
    # Separately, every release below 1.22.0 imports eval_type_backport from
    # a pydantic internal that pydantic 2.14 removed, while allowing
    # pydantic <3, so that pairing resolves cleanly and then fails at import.
    # pip cannot express "this mcp only with that pydantic", so the floor
    # covers that too. A resolution error beats an ImportError on first run.
    #
    # 2.x is supported and exercised in CI. The upper bound is against the
    # next unknown major: 2.x already moved host, port and transport_security
    # off Settings onto run(), and unbounded, a fresh install would follow
    # the next such change into a server that does not start.
    "mcp[cli]>=1.30.0,<3",
    "monarchmoneycommunity>=1.7.1",
    "gql>=3.4",
    "keyring>=24.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/robcerda/monarch-mcp-server"
Repository = "https://github.com/robcerda/monarch-mcp-server"
Issues = "https://github.com/robcerda/monarch-mcp-server/issues"

[project.scripts]
monarch-mcp-server = "monarch_mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
